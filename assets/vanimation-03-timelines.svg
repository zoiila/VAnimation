<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="820" viewBox="0 0 1680 820" role="img" aria-label="VAnimation — Orchestrated motion"><title>VAnimation — Orchestrated motion</title><desc>Editorial diagram showing a bounded timeline and owned resources</desc>
