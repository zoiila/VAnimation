<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="195" y="166" fill="#B8A0EA" font-size="20" font-weight="750" letter-spacing="2.2">03 / TIMELINES</text>
<text x="192" y="256" fill="#F8F7FC" font-size="63" font-weight="740" letter-spacing="-2">Orchestrated motion.</text>
<text x="196" y="300" fill="#B7C1D0" font-size="25">A shared visual layer that leaves games in control.</text>
<path d="M194 335H1442" stroke="#50596B" stroke-width="2"/>
<rect x="194" y="366" width="618" height="96" rx="3" fill="#161C27" stroke="#414756"/><rect x="194" y="366" width="6" height="96" fill="#B8A0EA"/><text x="222" y="402" font-size="17" font-weight="750" fill="#B8A0EA">01</text><text x="279" y="403" font-size="27" font-weight="730" fill="#F8F7FC">Run a sequence</text><text x="279" y="436" font-size="18" fill="#B7C1D0">A timeline with a clear scope and finish.</text><rect x="194" y="472" width="618" height="96" rx="3" fill="#161C27" stroke="#414756"/><rect x="194" y="472" width="6" height="96" fill="#B8A0EA"/><text x="222" y="508" font-size="17" font-weight="750" fill="#B8A0EA">02</text><text x="279" y="509" font-size="27" font-weight="730" fill="#F8F7FC">Animate displays</text><text x="279" y="542" font-size="18" fill="#B7C1D0">Item, block, and text display visuals.</text><rect x="194" y="578" width="618" height="96" rx="3" fill="#161C27" stroke="#414756"/><rect x="194" y="578" width="6" height="96" fill="#B8A0EA"/><text x="222" y="614" font-size="17" font-weight="750" fill="#B8A0EA">03</text><text x="279" y="615" font-size="27" font-weight="730" fill="#F8F7FC">Cancel and release</text><text x="279" y="648" font-size="18" fill="#B7C1D0">Managed resource ownership and cleanup.</text><rect x="848" y="361" width="594" height="324" rx="5" fill="#161C27" stroke="#50596B"/>
<text x="882" y="406" font-size="18" font-weight="750" letter-spacing="1.4" fill="#B8A0EA">BOUNDED TIMELINE</text>
