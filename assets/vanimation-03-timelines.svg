<circle cx="924" cy="548" r="6.5" fill="#A68BBF"/><circle cx="1088" cy="548" r="7" fill="#B8A0EA"/><circle cx="1262" cy="548" r="7" fill="#F062B4"/>
<text x="883" y="616" fill="#B7C1D0" font-size="18">A controlled visual sequence,</text>
<text x="883" y="644" fill="#B7C1D0" font-size="18">not an uncontrolled effect loop.</text>
