<text x="257" y="429" fill="#B7C1D0" font-size="18">Gameplay logic remains in the game plugin.</text>
<path d="M208 451H851" stroke="#46495A" stroke-width="1.5"/>
<text x="207" y="494" fill="#B8A0EA" font-size="18" font-weight="760" letter-spacing="1.7">02</text>
<text x="257" y="494" fill="#F8F7FC" font-size="27" font-weight="730">The visual takes focus.</text>
<text x="257" y="527" fill="#B7C1D0" font-size="18">An item rises as a text display appears.</text>
<path d="M208 549H851" stroke="#46495A" stroke-width="1.5"/>
<text x="207" y="592" fill="#B8A0EA" font-size="18" font-weight="760" letter-spacing="1.7">03</text>
<text x="257" y="592" fill="#F8F7FC" font-size="27" font-weight="730">The sequence finishes.</text>
<text x="257" y="625" fill="#B7C1D0" font-size="18">Complete or cancel; release owned visuals.</text>
</g>
